name: Verify mirror

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Hashes and AX0
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify artifact hashes
        run: python3 verify.py

      - name: Install the pinned Lean toolchain
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'

      - name: Compile AX0
        run: lake build
